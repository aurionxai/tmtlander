<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup · Gemini-style Layout · TheMoneyTeam.Law</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0A0A0A;
      --primary-mid: #1A1A1A;
      --primary-light: #2A2A2A;
      --accent: #A8821C;
      --accent-light: #C8932E;
      --accent-vivid: #D4AF37;
      --bg: #FAFAF7;
      --surface: #FFFFFF;
      --surface-2: #F2F0EA;
      --surface-3: #E8E5DC;
      --text: #1A1A1A;
      --text-muted: #6B6B6B;
      --success: #1E8A60;
      --danger: #B22222;
      --border: rgba(0,0,0,0.10);
      --radius: 14px;
      --shadow: 0 18px 50px rgba(0,0,0,0.10);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    /* ─── HERO ─── */
    .hero {
      background: linear-gradient(160deg, #FFFFFF 0%, #FAFAF7 50%, #F5F2E8 100%);
      padding: 48px 20px 70px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 30%, rgba(168,130,28,0.10), transparent 70%);
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(168,130,28,0.55), transparent);
      pointer-events: none;
    }
    .firm-logo {
      display: block;
      width: clamp(120px, 18vw, 168px);
      height: auto;
      margin: 0 auto 14px;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.18));
    }
    .firm-tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(168,130,28,0.45);
      background: rgba(168,130,28,0.06);
      padding: 5px 16px;
      border-radius: 50px;
      margin-bottom: 18px;
    }
    .hero h1 {
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: clamp(38px, 8vw, 72px);
      font-weight: 400;
      line-height: 1.05;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }
    .hero h1 em { font-style: normal; color: var(--accent); }
    .hero p {
      font-size: clamp(15px, 2vw, 18px);
      color: var(--text-muted);
      max-width: 540px;
      margin: 0 auto 28px;
    }
    .trust-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .trust-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .trust-item svg { color: var(--accent); flex-shrink: 0; }

    /* ─── HERO PHONE CTA ─── */
    .hero-phone {
      margin: 26px auto 6px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: clamp(24px, 4.5vw, 34px);
      letter-spacing: 1.5px;
      color: var(--accent);
      text-decoration: none;
      padding: 10px 26px;
      border: 2px solid var(--accent);
      border-radius: 50px;
      background: rgba(168,130,28,0.06);
      transition: all .2s ease;
      position: relative;
      z-index: 2;
    }
    .hero-phone:hover {
      background: var(--accent);
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(168,130,28,0.30);
    }
    .hero-phone svg { flex-shrink: 0; }
    .hero-phone-num { line-height: 1; }
    .hero-phone-label {
      margin-top: 8px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* ─── CELEBRITY ENDORSEMENT ─── */
    .endorsement {
      margin: 30px auto 4px;
      max-width: 480px;
      display: flex;
      gap: 18px;
      align-items: center;
      text-align: left;
      background: rgba(168,130,28,0.04);
      border: 1px solid rgba(168,130,28,0.22);
      border-radius: 16px;
      padding: 16px 18px;
      position: relative;
      z-index: 2;
    }
    .endorsement-photo {
      width: 104px;
      height: 132px;
      border-radius: 12px;
      background: rgba(168,130,28,0.08);
      border: 1px solid rgba(168,130,28,0.30);
      overflow: hidden;
      flex-shrink: 0;
    }
    .endorsement-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .endorsement-text { flex: 1; min-width: 0; }
    .endorsement-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .endorsement-quote {
      font-family: 'Newsreader', 'Georgia', serif;
      font-style: italic;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text);
      margin: 0 0 8px;
    }
    .endorsement-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .endorsement-title { font-size: 11px; color: var(--text-muted); margin-top: 1px; letter-spacing: 0.3px; }
    @media (max-width: 600px) {
      .endorsement {
        flex-direction: column;
        text-align: center;
        align-items: center;
        max-width: 340px;
        padding: 14px 16px;
        gap: 12px;
      }
      .endorsement-quote { font-size: 13.5px; }
    }

    /* In-chat variant: flush banner under the chat header (Claude.ai-style intro) */
    .endorsement.endorsement-inchat {
      margin: 0;
      max-width: none;
      border-radius: 0;
      border-left: 0;
      border-right: 0;
      border-top: 0;
      border-bottom: 1px solid rgba(168,130,28,0.22);
      padding: 14px 20px;
    }
    @media (max-width: 600px) {
      .endorsement.endorsement-inchat {
        flex-direction: row;
        text-align: left;
        align-items: center;
        max-width: none;
        padding: 12px 14px;
        gap: 12px;
      }
      .endorsement.endorsement-inchat .endorsement-photo { width: 56px; height: 56px; flex-shrink: 0; }
      .endorsement.endorsement-inchat .endorsement-quote { font-size: 13px; }
    }

    /* ─── CHAT WRAPPER ─── */
    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      padding: 28px 16px 40px;
      position: relative;
      z-index: 10;
    }
    .chat-card {
      background: var(--surface);
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      width: 100%;
      max-width: 700px;
      margin: auto; /* centers vertically in flex parent; collapses safely on overflow */
    }

    /* ─── CHAT HEADER ─── */
    .chat-header {
      background: linear-gradient(90deg, #FFFFFF 0%, #F5F2E8 100%);
      border-bottom: 1px solid rgba(168,130,28,0.30);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-avatar {
      width: 42px; height: 42px;
      background: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(168,130,28,0.25);
    }
    .chat-meta h3 { font-size: 15px; font-weight: 700; color: var(--text); }
    .chat-meta p { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    .online { width: 7px; height: 7px; background: var(--success); border-radius: 50%; display: inline-block; }

    /* ─── ASK A QUESTION ─── */
    .ask-btn {
      margin-left: auto;
      background: rgba(168,130,28,0.08);
      border: 1px solid rgba(168,130,28,0.35);
      color: var(--accent);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
    }
    .ask-btn:hover { background: rgba(168,130,28,0.18); color: var(--accent); border-color: var(--accent); }
    .reset-btn-hdr {
      background: rgba(168,130,28,0.08);
      border: 1px solid rgba(168,130,28,0.35);
      color: var(--accent);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
    }
    .reset-btn-hdr:hover { background: rgba(168,130,28,0.18); color: var(--accent); border-color: var(--accent); }
    .kb-input-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 0;
    }
    .kb-input-hint {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }
    .kb-input-row {
      display: flex;
      gap: 8px;
    }
    .kb-input-row input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    .kb-input-row input:focus { border-color: var(--accent); }
    .kb-chips-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      margin-bottom: 6px;
    }
    .kb-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 10px;
    }
    .kb-chip {
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
    }
    .kb-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(168,130,28,0.10);
    }

    /* ─── PROGRESS ─── */
    .progress-bar { height: 3px; background: var(--surface-2); }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      transition: width 0.6s ease;
      border-radius: 0 2px 2px 0;
    }

    /* ─── MESSAGES ─── */
    .messages {
      padding: 16px 20px 8px;
      min-height: 60px;
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }

    .msg { display: flex; gap: 9px; animation: fadeUp .28s ease; }
    .msg.bot { align-self: flex-start; max-width: 88%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; max-width: 78%; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-icon {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .msg.bot .msg-icon { background: var(--primary-mid); }
    .msg.user .msg-icon { background: var(--accent); }
    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.55;
    }
    .msg.bot .bubble {
      background: var(--surface-2);
      color: var(--text);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }
    .msg.user .bubble {
      background: var(--accent);
      color: #FFFFFF;
      border-bottom-right-radius: 4px;
      font-weight: 600;
    }

    /* ─── FLOYD INTRO BUBBLE (Claude.ai-style assistant intro as first message) ─── */
    .msg.msg-floyd .msg-icon {
      width: 40px; height: 40px;
      background: var(--accent);
      padding: 0;
      overflow: hidden;
      border: 1.5px solid var(--accent);
    }
    .msg.msg-floyd .msg-icon img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .msg.msg-floyd .bubble {
      background: linear-gradient(160deg, rgba(168,130,28,0.10), rgba(168,130,28,0.02));
      border: 1px solid rgba(168,130,28,0.32);
      padding: 12px 16px 13px;
    }
    .msg-floyd-credit {
      display: block;
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: 11px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
      line-height: 1.1;
    }
    .msg-floyd-quote {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 15.5px;
      font-style: italic;
      line-height: 1.5;
      color: var(--text);
    }
    @media (max-width: 600px) {
      .msg.msg-floyd .msg-icon { width: 34px; height: 34px; }
      .msg-floyd-quote { font-size: 14px; }
    }

    /* ─── TYPING ─── */
    .typing-wrap { display: flex; gap: 9px; align-items: center; animation: fadeUp .28s ease; }
    .typing-bubble {
      background: var(--surface-2);
      padding: 11px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      display: flex; gap: 5px; align-items: center;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bop 1.15s infinite;
    }
    .dot:nth-child(2) { animation-delay: .18s; }
    .dot:nth-child(3) { animation-delay: .36s; }
    @keyframes bop {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ─── OPTIONS AREA ─── */
    .opts-wrap { padding: 12px 20px 20px; }

    .opts-pills { display: flex; flex-wrap: wrap; gap: 9px; }
    .pill {
      background: #FFFFFF;
      border: 1.5px solid rgba(168,130,28,0.55);
      color: var(--accent);
      padding: 9px 18px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s;
      touch-action: manipulation; /* eliminates 300ms tap delay on iOS */
    }
    .pill:hover { background: var(--accent); color: #FFFFFF; border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(168,130,28,0.25); }

    .opts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }
    .practice-card {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px 36px 16px 14px; /* extra right padding for chevron affordance */
      cursor: pointer;
      transition: all .2s;
      text-align: left;
      touch-action: manipulation;
      position: relative;
    }
    .practice-card::after {
      content: '›';
      position: absolute;
      right: 14px;
      bottom: 10px;
      font-size: 26px;
      line-height: 1;
      color: var(--accent);
      font-weight: 700;
      opacity: 0.65;
      transition: transform .2s ease, opacity .2s ease;
    }
    .practice-card:hover {
      border-color: var(--accent);
      background: rgba(168,130,28,0.06);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }
    .practice-card:hover::after {
      transform: translateX(4px);
      opacity: 1;
    }
    .pc-icon { font-size: 22px; margin-bottom: 7px; }
    .pc-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
    .pc-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

    /* ─── CONTACT FORM ─── */
    .contact-form { display: flex; flex-direction: column; gap: 12px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); }
    .field input, .field select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 16px; /* 16px minimum prevents iOS Safari auto-zoom on focus */
      color: var(--text);
      outline: none;
      transition: border-color .18s;
      -webkit-appearance: none;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--text-muted); }
    .field select option { background: var(--surface); }
    .submit-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      border: none;
      color: #0A0A0A;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .3px;
      margin-top: 2px;
      touch-action: manipulation;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(168,130,28,.35); }
    .form-note { font-size: 11px; color: var(--text-muted); text-align: center; line-height: 1.5; }

    /* ─── SUCCESS ─── */
    .success-wrap {
      text-align: center;
      padding: 28px 20px 32px;
    }
    .success-icon {
      width: 62px; height: 62px;
      background: rgba(46,168,126,.18);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin: 0 auto 14px;
    }
    .success-wrap h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .success-wrap p { font-size: 14px; color: var(--text-muted); margin-bottom: 18px; max-width: 380px; margin-left: auto; margin-right: auto; }
    .case-summary {
      background: var(--surface-2);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      margin-bottom: 18px;
    }
    .case-summary-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }
    .case-summary-row { font-size: 14px; margin-top: 5px; }

    /* ─── DQ STATE ─── */
    .dq-wrap { text-align: center; padding: 24px 20px 28px; }
    .dq-icon { font-size: 38px; margin-bottom: 12px; }
    .dq-wrap h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .dq-wrap p { font-size: 14px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.6; }

    /* ─── SHARED BUTTONS ─── */
    .restart-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 9px 20px;
      border-radius: 50px;
      font-size: 13px;
      cursor: pointer;
      transition: all .18s;
      touch-action: manipulation;
    }
    .restart-btn:hover { border-color: var(--text-muted); color: var(--text); }

    /* ─── UNDO LINK ─── */
    .undo-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 0;
      opacity: 0.7;
      transition: opacity .18s, color .18s;
      display: block;
      width: 100%;
      text-align: center;
    }
    .undo-link:hover { opacity: 1; color: var(--accent); }

    /* ─── TEXT INPUT ─── */
    .chat-input-row {
      border-top: 1px solid var(--border);
      padding: 13px 16px;
      display: none;
      gap: 10px;
      align-items: center;
    }
    .chat-input-row input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 11px 18px;
      font-size: 16px; /* 16px minimum prevents iOS Safari auto-zoom on focus */
      color: var(--text);
      outline: none;
      transition: border-color .18s;
    }
    .chat-input-row input:focus { border-color: var(--accent); }
    .chat-input-row input::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 48px; height: 48px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .18s;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    .send-btn:hover { background: var(--accent-light); transform: scale(1.07); }

    /* ─── FOOTER ─── */
    .footer {
      max-width: 700px;
      margin: 0 auto 48px;
      padding: 0 16px;
      text-align: center;
    }
    .disclaimer {
      font-size: 11.5px;
      color: var(--text-muted);
      background: var(--surface);
      border-radius: 10px;
      padding: 14px 16px;
      line-height: 1.7;
      border: 1px solid var(--border);
    }

    /* ─── NURSING HOME DROPDOWN ─── */
    .nh-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 10px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .nh-dd-item {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .nh-dd-item:last-child { border-bottom: none; }
    .nh-dd-item:hover { background: rgba(168,130,28,0.10); }
    .nh-dd-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .nh-dd-loc {
      font-size: 12px;
      color: var(--text-muted);
    }
    .nh-dd-loading, .nh-dd-empty {
      color: var(--text-muted);
      font-size: 13px;
      font-style: italic;
      cursor: default;
    }
    .nh-dd-loading:hover, .nh-dd-empty:hover { background: none; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      .chat-wrap { padding: 16px 8px 28px; }
      .chat-card { border-radius: 16px; }
      .chat-header { padding: 10px 14px; gap: 8px; }
      .chat-avatar { width: 34px; height: 34px; font-size: 16px; }
      .chat-meta h3 { font-size: 14px; }
      .chat-meta p { font-size: 11px; }
      .ask-btn { font-size: 11px; padding: 5px 8px; }
      .reset-btn-hdr { font-size: 11px; padding: 5px 8px; }
      .messages { padding: 12px 14px 6px; max-height: 340px; gap: 10px; }
      .msg.bot { max-width: 95%; }
      .msg.user { max-width: 88%; }
      .msg-bubble { font-size: 14px; padding: 10px 13px; }
      .opts-wrap { padding: 10px 14px 16px; }
      .opts-pills { gap: 7px; }
      .pill { font-size: 13px; padding: 11px 14px; min-height: 44px; } /* 44px touch target */
      /* 2-col practice grid stays on mobile so all injury types are visible at a glance */
      .opts-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .practice-card { padding: 12px 22px 12px 10px; min-height: 92px; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .practice-card::after { right: 7px; bottom: 7px; font-size: 22px; }
      .pc-icon  { font-size: 26px; margin-bottom: 6px; }
      .pc-title { font-size: 13px; line-height: 1.2; }
      .pc-desc  { display: none; } /* hide long descriptions on phones — title + icon is enough for quick selection */
      .form-row { grid-template-columns: 1fr; }
      .hero { padding: 28px 16px 50px; }
      .hero h1 { font-size: clamp(34px, 10vw, 58px); }
      .modal-sheet { padding: 20px 16px 36px; }
      .modal-h { font-size: 18px; }          /* prevent long titles wrapping badly */
      #sigPad { height: 140px; }             /* more room for finger signatures */
      /* Retainer address: stack City/State/ZIP vertically on narrow screens */
      .retainer-addr-row { flex-direction: column !important; }
    }

    /* ─── POST-SUBMIT MODAL ─── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(20,20,20,.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 200;
      display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    .modal-sheet {
      background: var(--surface);
      border-radius: 22px 22px 0 0;
      width: 100%; max-width: 720px;
      max-height: 94vh;
      overflow-y: auto;
      padding: 28px 24px 44px;
      animation: sheetUp .3s ease;
    }
    @keyframes sheetUp {
      from { transform: translateY(50px); opacity:0; }
      to   { transform: translateY(0);    opacity:1; }
    }
    .modal-sheet::-webkit-scrollbar { width: 4px; }
    .modal-sheet::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius:2px; }

    /* Wizard nav */
    .wizard-nav {
      display: flex; gap: 6px; margin-bottom: 28px;
    }
    .wz-step {
      flex: 1; text-align: center; font-size: 11px;
      color: var(--text-muted); padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
      transition: all .2s;
    }
    .wz-step.active { color: var(--accent); border-color: var(--accent); font-weight: 700; }
    .wz-step.done   { color: var(--success); border-color: var(--success); }
    .wz-num {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid currentColor;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 5px; font-size: 11px; font-weight: 700;
    }
    .wz-step.active .wz-num { background: var(--accent); border-color: var(--accent); color:#fff; }
    .wz-step.done .wz-num   { background: var(--success); border-color: var(--success); color:#fff; }

    .modal-h   { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .modal-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 22px; line-height:1.55; }

    /* Claim assessment banner */
    .claim-banner {
      background: rgba(46,168,126,.12);
      border: 1px solid rgba(46,168,126,.3);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex; gap: 14px; align-items: flex-start;
      margin-bottom: 22px;
    }
    .claim-banner-icon { font-size: 26px; flex-shrink:0; margin-top:2px; }
    .claim-banner-text h4 { font-size: 15px; font-weight:700; color: var(--success); margin-bottom:4px; }
    .claim-banner-text p  { font-size: 13px; color: var(--text-muted); line-height:1.5; }

    /* Next steps */
    .next-steps { display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
    .ns-item {
      display:flex; gap:12px; align-items:flex-start;
      background: var(--surface-2); border-radius:12px; padding:12px 14px;
    }
    .ns-num {
      width:22px; height:22px; border-radius:50%;
      background: var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:700; flex-shrink:0; margin-top:2px;
    }
    .ns-body { font-size:13.5px; line-height:1.5; }
    .ns-body strong { display:block; font-size:14px; margin-bottom:2px; }

    /* Docs needed checklist */
    .docs-needed {
      display: flex; flex-direction:column; gap:8px; margin-bottom:22px;
    }
    .doc-needed-item {
      display:flex; align-items:center; gap:10px;
      background: var(--surface-2); border-radius:10px; padding:10px 14px;
      font-size:13.5px;
    }
    .doc-needed-item .req { font-size:10px; padding:2px 8px; border-radius:50px; font-weight:700; }
    .req.required { background:rgba(168,130,28,.16); color:var(--accent); }
    .req.helpful  { background:rgba(0,0,0,.05); color:var(--text-muted); }

    /* Upload zones */
    .upload-section { display:flex; flex-direction:column; gap:14px; margin-bottom:8px; }
    .upload-zone {
      border: 2px dashed rgba(0,0,0,.18);
      border-radius: 14px; padding:18px 16px;
      text-align:center; cursor:pointer;
      transition: all .2s; background:var(--surface-2);
      position:relative;
    }
    .upload-zone:hover, .upload-zone.over {
      border-color: var(--accent); background:rgba(168,130,28,.07);
    }
    .upload-zone input[type=file] {
      position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;
    }
    .uz-icon  { font-size:26px; margin-bottom:6px; }
    .uz-title { font-size:14px; font-weight:700; margin-bottom:3px; }
    .uz-hint  { font-size:12px; color:var(--text-muted); }
    .uz-badge { display:inline-block; font-size:10px; padding:2px 8px; border-radius:50px; font-weight:700; margin-bottom:8px; }
    .uz-badge.req  { background:rgba(168,130,28,.18); color:var(--accent); }
    .uz-badge.opt  { background:rgba(0,0,0,.05); color:var(--text-muted); }
    .file-list { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
    .file-chip {
      background:var(--surface-3); border-radius:8px;
      padding:5px 10px; font-size:12px;
      display:flex; align-items:center; gap:7px;
      border:1px solid var(--border);
    }
    .file-chip .rm { cursor:pointer; color:var(--danger); font-weight:700; line-height:1; }

    /* Retainer doc */
    .retainer-scroll {
      background:var(--surface-2); border:1px solid var(--border);
      border-radius:14px; padding:18px 16px;
      font-size:12.5px; line-height:1.8;
      color:var(--text-muted); max-height:220px;
      overflow-y:auto; margin-bottom:18px;
    }
    .retainer-scroll::-webkit-scrollbar { width:4px; }
    .retainer-scroll::-webkit-scrollbar-thumb { background:rgba(0,0,0,.15); }
    .retainer-scroll h4 { color:var(--text); font-size:13px; margin:14px 0 4px; text-transform:uppercase; letter-spacing:.5px; }
    .retainer-scroll h4:first-child { margin-top:0; }
    .retainer-scroll .hi { color:var(--accent); font-weight:700; }

    /* Signature */
    .sig-wrap { margin-bottom:18px; }
    .sig-label { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-muted); margin-bottom:8px; }
    .sig-canvas-box {
      background:#fff; border-radius:12px;
      border:2px solid var(--border);
      overflow:hidden; position:relative; cursor:crosshair;
    }
    .sig-canvas-box.signed { border-color:var(--accent); }
    #sigPad { display:block; width:100%; height:120px; touch-action:none; }
    .sig-ghost {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      font-size:13px; color:#bbb;
      pointer-events:none; text-align:center; line-height:1.6;
      user-select:none;
    }
    .sig-clear { font-size:12px; color:var(--text-muted); background:none; border:none; cursor:pointer; text-decoration:underline; display:block; text-align:right; margin-top:6px; }

    /* Modal action buttons */
    .modal-actions { display:flex; gap:12px; margin-top:22px; }
    .btn-primary {
      flex:1; background:linear-gradient(135deg, var(--accent), var(--accent-light));
      border:none; color:#FFFFFF; padding:16px;
      border-radius:12px; font-size:15px; font-weight:700;
      cursor:pointer; transition:all .2s; letter-spacing:.2px;
      min-height: 48px;
    }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(168,130,28,.30); }
    .btn-primary:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
    .btn-ghost {
      background:transparent; border:1.5px solid var(--border);
      color:var(--text-muted); padding:16px 18px;
      border-radius:12px; font-size:14px; font-weight:500;
      cursor:pointer; transition:all .2s;
      min-height: 48px;
    }
    .btn-ghost:hover { border-color:var(--text-muted); color:var(--text); }

    /* Final signed screen */
    .final-signed { text-align:center; padding:16px 0 8px; }
    .final-signed .big-icon { font-size:52px; margin-bottom:14px; }
    .final-signed h3 { font-size:20px; font-weight:800; margin-bottom:8px; }
    .final-signed p  { font-size:14px; color:var(--text-muted); line-height:1.6; margin-bottom:18px; }
    .checklist-row { display:flex; align-items:center; gap:9px; font-size:14px; margin-bottom:9px; }
    .checklist-row .ck { color:var(--success); font-size:16px; }

    /* ─── POST-SIGN "WHAT HAPPENS NEXT" PANEL ─── */
    .next-comms {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px 16px 8px;
      margin-bottom: 20px;
      text-align: left;
    }
    .next-comms-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--text-muted);
      font-weight: 700;
      margin: 12px 0 4px;
    }
    .comm-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .comm-row + .comm-row { /* dividers between */ }
    .comm-row:first-of-type { border-top: none; }
    .comm-icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .comm-body { flex: 1; min-width: 0; }
    .comm-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .comm-detail { font-size: 12.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .comm-status {
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      white-space: nowrap;
      color: var(--text-muted);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .comm-status.sending::after {
      content: '';
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: comm-pulse 1s ease-in-out infinite;
    }
    .comm-status.sent { color: var(--success); }
    .comm-status.sent::before { content: '✓'; font-size: 13px; }
    .comm-status.scheduled { color: var(--accent); }
    .comm-status.scheduled::before { content: '🕒'; font-size: 12px; }
    @keyframes comm-pulse {
      0%, 100% { opacity: .25; transform: scale(.85); }
      50%      { opacity: 1;   transform: scale(1); }
    }

    /* ─── CORNER PHONE (upper-right, scrolls with page — not floating) ─── */
    .corner-phone {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: 17px;
      letter-spacing: 1.2px;
      color: var(--accent);
      text-decoration: none;
      padding: 9px 16px;
      border: 2px solid var(--accent);
      border-radius: 50px;
      background: #FFFFFF;
      box-shadow: 0 6px 22px rgba(168,130,28,0.18);
      transition: all .18s ease;
    }
    .corner-phone:hover {
      background: var(--accent);
      color: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(168,130,28,0.32);
    }
    .corner-phone svg { flex-shrink: 0; }
    .corner-phone-num { line-height: 1; }
    .corner-phone-label {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      color: inherit;
      opacity: 0.78;
      line-height: 1;
      margin-left: 2px;
      padding-left: 8px;
      border-left: 1px solid currentColor;
    }
    @media (max-width: 600px) {
      .corner-phone {
        top: 10px; right: 10px;
        font-size: 14px; padding: 7px 12px; gap: 6px;
      }
      .corner-phone-label { display: none; }
    }

    /* ─── HERO CTA (where the phone used to be) ─── */
    .hero-cta {
      margin: 26px auto 6px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: clamp(22px, 4.2vw, 32px);
      letter-spacing: 2px;
      color: #FFFFFF;
      text-decoration: none;
      padding: 14px 34px;
      border: 2px solid var(--accent);
      border-radius: 50px;
      background: var(--accent);
      transition: all .2s ease;
      position: relative;
      z-index: 2;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(168,130,28,0.28);
    }
    .hero-cta:hover {
      background: var(--accent-vivid);
      border-color: var(--accent-vivid);
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(212,175,55,0.4);
    }
    .hero-cta-arrow {
      font-size: 1.05em; line-height: 1;
      transition: transform .18s ease;
    }
    .hero-cta:hover .hero-cta-arrow { transform: translateX(3px); }
    .hero-cta-sub {
      margin-top: 10px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* ─── ONE-PANE LAYOUT (ChatGPT/Claude/Gemini-style full-viewport) ─── */

    html, body {
      height: 100dvh;
      overflow: hidden;
      margin: 0;
    }
    body {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* Slim top bar — brand left, phone + reset right (no big hero) */
    .topbar {
      flex-shrink: 0;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      background: linear-gradient(90deg, #FFFFFF 0%, #FAFAF7 100%);
      border-bottom: 1px solid rgba(168,130,28,0.22);
      z-index: 50;
    }
    .topbar-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .topbar-logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .topbar-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-name em { font-style: normal; color: var(--accent); }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .topbar-phone {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--accent);
      text-decoration: none;
      padding: 6px 12px;
      border: 1.5px solid var(--accent);
      border-radius: 50px;
      transition: all .15s;
    }
    .topbar-phone:hover { background: var(--accent); color: #FFFFFF; }
    .topbar-btn {
      background: rgba(168,130,28,0.06);
      border: 1px solid rgba(168,130,28,0.35);
      color: var(--accent);
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .topbar-btn:hover { background: var(--accent); color: #FFFFFF; }

    /* Main pane: chat column on the left, data-collected panel on the right */
    .main-pane {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      background: var(--bg);
    }
    .chat-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .chat-col .progress-bar { flex-shrink: 0; }
    .messages-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      max-width: 760px;
      padding: 22px 22px 6px;
      gap: 16px;
      overflow-y: auto;
    }
    #optsArea {
      flex-shrink: 0;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      max-height: 42vh;
      overflow-y: auto;
    }
    .chat-input-row {
      flex-shrink: 0;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      background: transparent;
      border-top: 0;
      padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      gap: 10px;
    }
    .chat-input-row input {
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }

    /* Tiny disclaimer pinned beneath the input bar (ChatGPT-style) */
    .pane-disclaimer {
      flex-shrink: 0;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 16px 10px;
      letter-spacing: 0.2px;
    }

    /* DATA-COLLECTED PANEL — right side, the only thing "outside the chat" */
    .data-panel {
      flex: 0 0 320px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow: hidden;
    }
    .data-head {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, #FFFFFF 0%, #F5F2E8 100%);
      flex-shrink: 0;
    }
    .data-head h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1.6px;
      color: var(--text);
      margin: 0 0 3px;
    }
    .data-head .data-progress { font-size: 11px; color: var(--text-muted); letter-spacing: 0.3px; }
    .data-progress .data-progress-num { color: var(--accent); font-weight: 700; }
    .data-body {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }
    .data-row {
      padding: 10px 20px;
      border-bottom: 1px solid rgba(168,130,28,0.08);
      position: relative;
      cursor: pointer;
      transition: background .15s;
    }
    .data-row:last-child { border-bottom: 0; }
    .data-row:hover { background: rgba(168,130,28,0.04); }
    .data-row:hover .data-edit { opacity: 1; }
    .data-label {
      display: block;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 3px;
    }
    .data-value {
      display: block;
      font-size: 13.5px;
      color: var(--text);
      font-weight: 500;
      line-height: 1.4;
      padding-right: 24px;
    }
    .data-value.pending {
      color: var(--text-muted);
      font-style: italic;
      font-weight: 400;
    }
    .data-edit {
      position: absolute;

let _nhData = null; // populated on first keystroke

async function _loadNhData() {
  if (_nhData) return _nhData;
  const bin = Uint8Array.from(atob(_NH_B64), c => c.charCodeAt(0));
  const ds  = new DecompressionStream("gzip");
  const w   = new WritableStream();
  const chunks = [];
  const writer = ds.writable.getWriter();
  const reader = ds.readable.getReader();
  const pump = async () => {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
    }
  };
  writer.write(bin);
  writer.close();
  await pump();
  const total = chunks.reduce((s,c) => s + c.length, 0);
  const out   = new Uint8Array(total);
  let pos = 0;
  for (const c of chunks) { out.set(c, pos); pos += c.length; }
  _nhData = new TextDecoder().decode(out).split("\n");
  return _nhData;
}

function _nhSearch(query, max = 8) {
  if (!_nhData || query.length < 2) return [];
  const q = query.toLowerCase();
  const results = [];
  for (const line of _nhData) {
    if (results.length >= max) break;
    if (line.toLowerCase().includes(q)) {
      const [name, city, state] = line.split("|");
      results.push({ name, city, state });
    }
  }
  return results;
}

/* =====================================================
   CORE UI HELPERS
   ===================================================== */
const $msgs      = document.getElementById("messages");
const $opts      = document.getElementById("optsArea");
const $inputRow  = document.getElementById("inputRow");
const $textInput = document.getElementById("textInput");
const $progress  = document.getElementById("progressFill");

function setProgress(n) { $progress.style.width = n + "%"; }
function scrollDown()   { $msgs.scrollTop = $msgs.scrollHeight; }

// iOS keyboard fix: when the virtual keyboard opens it shrinks the visual viewport.
// Scroll the bottom of the chat card into view so the input row stays visible.
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    requestAnimationFrame(() => {
      $inputRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
      scrollDown();
    });
  });
}

function clearOpts() {
  $opts.innerHTML = "";
  $inputRow.style.display = "none";
}

const BOT_AVATAR_HTML  = '<img src="assets/floyd-portrait.png" alt="Floyd">';
const USER_AVATAR_HTML = '👤';

function addMsg(html, who = "bot") {
  const icon = who === "bot" ? BOT_AVATAR_HTML : USER_AVATAR_HTML;
  const d = document.createElement("div");
  d.className = `msg ${who}`;
  d.innerHTML = `<div class="msg-icon">${icon}</div><div class="bubble">${html}</div>`;
  $msgs.appendChild(d);
  scrollDown();
}

function showTyping() {
  const d = document.createElement("div");
  d.className = "typing-wrap";
  d.id = "typing";
  d.innerHTML = `
    <div class="msg-icon">${BOT_AVATAR_HTML}</div>
    <div class="typing-bubble">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>`;
  $msgs.appendChild(d);
  scrollDown();
}

function removeTyping() {
  const el = document.getElementById("typing");
  if (el) el.remove();
}

function botDelay(html, ms = 950) {
  return new Promise(resolve => {
    showTyping();
    setTimeout(() => {
      removeTyping();
      addMsg(html, "bot");
      resolve();
    }, ms);
  });
}

/* Show pill-style quick-reply options.
   opts: array of { label, value } OR strings */
function showPills(opts, onSelect, hideUndo = false) {
  clearOpts();
  const wrap = document.createElement("div");
  wrap.className = "opts-wrap";
  const row = document.createElement("div");
  row.className = "opts-pills";
  opts.forEach(o => {
    const label = typeof o === "string" ? o : o.label;
    const value = typeof o === "string" ? o : o.value;
    const btn = document.createElement("button");
    btn.className = "pill";
    btn.textContent = label;
    btn.onclick = () => {
      clearOpts();
      addMsg(label, "user");
      onSelect(value, label);
    };
    row.appendChild(btn);
  });
  wrap.appendChild(row);
  // Show undo link if there's a previous question to go back to

let _inputResolve = null;

function collectInput(placeholder = "Type here…") {
  return new Promise(resolve => {
    _inputResolve = resolve;
    clearOpts();
    $inputRow.style.display = "flex";
    $textInput.placeholder = placeholder;
    $textInput.value = "";
    // No programmatic focus — iOS blocks setTimeout focus outside direct user gesture.
    // Scroll the input into view so it's visible above the keyboard.
    requestAnimationFrame(() => $inputRow.scrollIntoView({ block: "nearest", behavior: "smooth" }));
  });
}

function collectPhoneInput() {
  return new Promise(resolve => {
    _inputResolve = resolve;
    clearOpts();
    $inputRow.style.display = "flex";
    $textInput.placeholder = "(555) 000-0000";
    $textInput.value = "";
    $textInput.setAttribute("type", "tel");
    $textInput.setAttribute("inputmode", "numeric");
    $textInput.setAttribute("maxlength", "14"); // (555) 000-0000 = 14 chars formatted

    const _fmt = () => { $textInput.value = formatPhoneInput($textInput.value); };
    $textInput.addEventListener("input", _fmt);
    $textInput._phoneCleanup = () => {
      $textInput.removeEventListener("input", _fmt);
      $textInput.removeAttribute("maxlength");
      $textInput.removeAttribute("inputmode");
      $textInput.setAttribute("type", "text");
      delete $textInput._phoneCleanup;
    };
    // No programmatic focus — iOS blocks setTimeout focus outside direct user gesture.
    requestAnimationFrame(() => $inputRow.scrollIntoView({ block: "nearest", behavior: "smooth" }));
  });
}

$textInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendText(); } });
function sendText() {
  const val = $textInput.value.trim();
  if (!val) return;
  if ($textInput._phoneCleanup) $textInput._phoneCleanup(); // remove phone formatting handler
  clearOpts();
  addMsg(val, "user");
  if (_inputResolve) {
    const cb = _inputResolve;
    _inputResolve = null;
    cb(val);
  }
}

/* =====================================================
   PHONE VERIFICATION (2FA)
   ===================================================== */
async function verifyPhone(phone) {
  // If no verify webhook configured, skip silently
  if (!CFG.smsVerifyUrl || CFG.smsVerifyUrl === "YOUR_VERIFY_WEBHOOK_URL_HERE") {
    console.warn("2FA skipped — no smsVerifyUrl configured.");
    return true;
  }

  // Generate a 6-digit code
  const code = String(Math.floor(100000 + Math.random() * 900000));

  // Send code via webhook
  let sent = false;
  try {
    const res = await fetch(CFG.smsVerifyUrl, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ phone, code }),
    });
    sent = res.ok;
  } catch (e) {
    console.error("Verify webhook error:", e);
  }

  if (!sent) {
    await botDelay("⚠️ We had trouble sending your verification code right now. Let's continue anyway — we'll confirm your number when we reach out.", 1300);
    return true; // fail open — don't block real leads
  }

  await botDelay(`We just sent a <strong>6-digit code</strong> to ${phone}. Enter it below. (It can take up to 30 seconds to arrive — if you don't get it, just wait a moment and try.)`, 1100);

  const MAX_ATTEMPTS = 3;
  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    const entered = await collectInput("Enter your 6-digit code…");

    if (entered.trim() === code) {
      await botDelay(`✅ Phone verified!`, 700);
      return true;
    }

    if (attempt < MAX_ATTEMPTS) {
      const remaining = MAX_ATTEMPTS - attempt;
      await botDelay(`That code doesn't match. ${remaining} attempt${remaining > 1 ? "s" : ""} remaining. Please try again.`, 1000);
    }
  }

  // 3 failed attempts — offer resend or continue
  await botDelay("We weren't able to verify that code. Would you like us to resend, or continue without verification?", 1200);
  return new Promise(resolve => {
    showPills([
      { label:"Resend the code",     value:"resend" },
      { label:"Continue anyway",     value:"skip" },
    ], async (val) => {
      if (val === "resend") {
        const result = await verifyPhone(phone); // recursive retry
        resolve(result);
      } else {
        await botDelay("No problem — we'll confirm your number when our team reaches out.", 900);
        resolve(true); // fail open
      }
    });
  });
}

function showMultiInjury(storeKey, customOpts) {
  const opts = customOpts || INJURY_OPTS_PHYSICAL;
  return new Promise(resolve => {
    clearOpts();
    const wrap = document.createElement("div");
    wrap.className = "opts-wrap";
    const row = document.createElement("div");
    row.className = "opts-pills";
    row.style.marginBottom = "12px";
    const selected = new Set();

    opts.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "pill";
      btn.textContent = opt.label;
      btn.dataset.value = opt.value;
      btn.onclick = () => {
        if (selected.has(opt.value)) {
          selected.delete(opt.value);
          btn.style.background = "";
          btn.style.color = "";
          btn.style.borderColor = "";
        } else {
          selected.add(opt.value);
          btn.style.background = "var(--accent)";
          btn.style.color = "#fff";
          btn.style.borderColor = "var(--accent)";
        }
        confirmBtn.disabled = selected.size === 0;
      };
      row.appendChild(btn);
    });

    const confirmBtn = document.createElement("button");
    confirmBtn.className = "submit-btn";
    confirmBtn.textContent = "Continue →";
    confirmBtn.disabled = true;
    confirmBtn.style.marginTop = "4px";
    confirmBtn.onclick = () => {
      const chosen = [...selected];
      clearOpts();
      addMsg(chosen.map(v => opts.find(o => o.value === v)?.label).join(", "), "user");
      S.data[storeKey] = chosen;
      resolve(chosen);
    };
    wrap.appendChild(row);
    wrap.appendChild(confirmBtn);
    $opts.appendChild(wrap);
    scrollDown();
  });
}

async function nhFlow_facility() {
  _trackQ(nhFlow_facility);
  await botDelay("What is the <strong>name of the nursing home or care facility</strong>?", 950);
  clearOpts();

  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex;flex-direction:column;gap:10px;padding:4px 0;position:relative;";

  const inputStyle = "background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:16px;outline:none;width:100%;box-sizing:border-box;";

  /* ── Name input with typeahead ── */
  const nameWrap = document.createElement("div");
  nameWrap.style.cssText = "position:relative;";

  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.placeholder = "Start typing facility name…";
  nameInput.autocomplete = "off";
  nameInput.style.cssText = inputStyle;

  const dd = document.createElement("div");
  dd.className = "nh-dropdown";
  dd.style.display = "none";

  nameWrap.appendChild(nameInput);
  nameWrap.appendChild(dd);

  /* ── City/State (auto-filled or manual) ── */
  const cityInput = document.createElement("input");
  cityInput.type = "text";
  cityInput.placeholder = "City, State (e.g. Houston, TX)";
  cityInput.autocomplete = "address-level2";
  cityInput.style.cssText = inputStyle;
  cityInput.addEventListener("input", () => { cityInput.style.borderColor = ""; });

  const btn = document.createElement("button");
  btn.className = "submit-btn";
  btn.textContent = "Continue →";
  btn.style.marginTop = "4px";

  /* ── Typeahead logic ── */
  let _ddOpen = false;
  let _searchTimeout = null;

  function closeDd() {
    dd.style.display = "none";
    dd.innerHTML = "";
    _ddOpen = false;
  }

  function selectFacility(name, city, state) {
    nameInput.value = name;
    cityInput.value = city + ", " + state;
    nameInput.style.borderColor = "var(--accent)";
    cityInput.style.borderColor = "var(--accent)";
    closeDd();
  }

  nameInput.addEventListener("input", () => {
    nameInput.style.borderColor = "";
    cityInput.style.borderColor = "";
    clearTimeout(_searchTimeout);
    const q = nameInput.value.trim();
    if (q.length < 2) { closeDd(); return; }

    // Show loading indicator immediately
    dd.style.display = "block";
    dd.innerHTML = '<div class="nh-dd-item"><span class="nh-dd-loading">Searching…</span></div>';
    _ddOpen = true;

    _searchTimeout = setTimeout(async () => {
      await _loadNhData();
      const results = _nhSearch(q);
      if (!results.length) {
        dd.innerHTML = '<div class="nh-dd-item"><span class="nh-dd-empty">No matches — you can type it manually</span></div>';
        return;
      }
      dd.innerHTML = "";
      results.forEach(r => {
        const item = document.createElement("div");
        item.className = "nh-dd-item";
        item.innerHTML = `<span class="nh-dd-name">${r.name}</span><span class="nh-dd-loc">${r.city}, ${r.state}</span>`;
        item.addEventListener("mousedown", e => { e.preventDefault(); selectFacility(r.name, r.city, r.state); });
        item.addEventListener("touchstart", e => { e.preventDefault(); selectFacility(r.name, r.city, r.state); }, { passive: false });
        dd.appendChild(item);
      });
    }, 200);
  });

  // Close dropdown on blur (small delay lets mousedown fire first)
  nameInput.addEventListener("blur", () => setTimeout(closeDd, 150));

  btn.onclick = async () => {
    closeDd();
    const name = nameInput.value.trim();
    const loc  = cityInput.value.trim();
    if (!name) { nameInput.style.borderColor = "var(--danger)"; nameInput.focus(); return; }
    if (!loc)  { cityInput.style.borderColor  = "var(--danger)"; cityInput.focus();  return; }
    S.data.nhFacilityName     = name;
    S.data.nhFacilityLocation = loc;
    clearOpts();
    addMsg(`${name} — ${loc}`, "user");
    setProgress(42);
    await nhFlow_timeGate();
  };

  wrap.appendChild(nameWrap);
  wrap.appendChild(cityInput);
  wrap.appendChild(btn);
  $opts.appendChild(wrap);
  scrollDown();
}

async function checkAttorney(onPass) {
  _trackQ(() => checkAttorney(onPass));
  await botDelay("One last question — do you <strong>already have a lawyer</strong> handling this case for you?", 950);
  showPills([
    { label:"No — I don't have a lawyer",         value:"no" },
    { label:"Yes — I already have representation",value:"yes" },
  ], async (val) => {
    S.data.hasAttorney = val;
    if (val === "yes") {
      await botDelay("If you already have a lawyer for this, we can't also take your case — the rules don't allow two firms to represent the same person on the same matter.", 1250);
      showDQ("You already have a lawyer for this case. If you're unhappy with your current attorney and want to switch, call us — we can talk through your options.");
      return;
    }
    // Collect phone after qualification confirmed
    let rawPhone = "";
    let phoneValid = false;
    while (!phoneValid) {
      await botDelay("You're almost there. What's the best <strong>phone number</strong> to reach you?", 900);
      rawPhone = await collectPhoneInput();
      if (isValidPhone(rawPhone)) {
        phoneValid = true;
        const d = rawPhone.replace(/\D/g, "");
        rawPhone = `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
      } else {
        await botDelay(`⚠️ ${phoneErrorMsg(rawPhone)} Example: (312) 555-0000`, 950);
      }
    }
    S.data.leadPhone = rawPhone;
    const phoneOk = await verifyPhone(S.data.leadPhone);
    if (!phoneOk) return;
    await onPass();
  });
}

function chatHandleFiles(files, key) {
  if (!S.data.chatUploads) S.data.chatUploads = {};
  if (!S.data.chatUploads[key]) S.data.chatUploads[key] = [];
  Array.from(files).forEach(f => {
    const reader = new FileReader();
    reader.onload = e => {
      S.data.chatUploads[key].push({ name: f.name, type: f.type, size: f.size, dataUrl: f.size < 5*1024*1024 ? e.target.result : null });
      renderChatFileList(key);
    };
    reader.readAsDataURL(f);
  });
}

function renderChatFileList(key) {
  const el = document.getElementById("cfl-" + key);
  if (!el) return;
  const files = (S.data.chatUploads || {})[key] || [];
  el.innerHTML = files.length ? `<div style="height:8px"></div>` + files.map((f, i) => `
    <div class="file-chip">
      ${f.type?.startsWith("image/") ? "🖼️" : "📄"} ${f.name}
      <span class="rm" onclick="removeChatFile('${key}',${i});event.stopPropagation()">✕</span>
    </div>`).join("") : "";
}

function removeChatFile(key, idx) {
  if (S.data.chatUploads?.[key]) {
    S.data.chatUploads[key].splice(idx, 1);
    renderChatFileList(key);
  }
}

async function submitLead() {
  const fname = document.getElementById("cf_fname").value.trim() || S.data.leadName?.split(" ")[0] || "";
  const lname = document.getElementById("cf_lname").value.trim() || S.data.leadName?.split(" ").slice(1).join(" ") || "";
  const phone = document.getElementById("cf_phone").value.trim() || S.data.leadPhone || "";
  const email = document.getElementById("cf_email").value.trim();
  const time  = document.getElementById("cf_time").value;

  if (!fname || !phone || !time || !isValidPhone(phone)) {
    if (!time) { document.getElementById("cf_time").focus(); return; }
    if (!isValidPhone(phone)) {
      const el = document.getElementById("cf_phone");
      el.style.borderColor = "var(--danger)";
      el.value = "";
      el.placeholder = phoneErrorMsg(phone);
      el.focus();
      setTimeout(() => { el.style.borderColor = ""; el.placeholder = "(555) 000-0000"; }, 4000);
      return;
    }
    document.getElementById("cf_fname").focus();
    return;
  }

  clearOpts();
  addMsg(`${fname} ${lname} · ${phone}`, "user");

  const areaLabels = {
    auto:   "Auto Accident",
    wc:     "Workers' Compensation",
    gpi:    "Personal Injury",
    nh:     "Nursing Home Negligence",
    medmal: "Medical Malpractice",
    ssdi:   "SSDI / Disability",
  };

  const lead = {
    name:         `${fname} ${lname}`.trim(),
    phone,
    email:        email || null,
    callTime:     time  || "ASAP",
    practiceArea: areaLabels[S.area] || S.area,
    qualified:    S.qualified,
    answers:      S.data,
    submittedAt:  new Date().toISOString(),
    sourceUrl:    window.location.href,
  };

  // Fire lead webhook (non-blocking)
  fireWebhook(lead);

  setProgress(100);

  showTyping();
  await new Promise(r => setTimeout(r, 1400));
  removeTyping();

  const qualified = S.qualified;

  if (qualified) {
    // Go straight to the agreement modal for fully qualified leads
    openAgreementModal(lead);
  } else {
    // Borderline / needs-review path — show holding screen
    $opts.innerHTML = `
      <div class="success-wrap">
        <div class="success-icon">📋</div>
        <h3>We'll Review Your Case, ${fname}</h3>
        <p>We'll have an attorney personally look at your <strong>${areaLabels[S.area] || "legal"}</strong> situation and get back to you soon.</p>
        <button class="restart-btn" onclick="restartChat()">← Evaluate another case</button>
      </div>`;
    scrollDown();
  }
}

async function fireWebhook(lead) {
  if (!CFG.smsWebhookUrl || CFG.smsWebhookUrl === "YOUR_WEBHOOK_URL_HERE") {
    console.log("📋 Lead captured (no webhook configured):", lead);
    return;
  }
  try {
    await fetch(CFG.smsWebhookUrl, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify(lead),
    });
    console.log("✅ Webhook fired successfully.");
  } catch (err) {
    console.error("⚠️ Webhook failed:", err);
  }
}

/* ─── Phone utilities ─── */
function formatPhoneInput(val) {
  // Strip non-digits, cap at 10
  const d = val.replace(/\D/g, "").slice(0, 10);
  if (d.length < 4)  return d;
  if (d.length < 7)  return `(${d.slice(0,3)}) ${d.slice(3)}`;
  return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
}

function isValidPhone(val) {
  const d = val.replace(/\D/g, "");
  if (d.length !== 10) return false;
  const ac = d.slice(0, 3);  // area code
  const ex = d.slice(3, 6);  // exchange
  // NANP rules: first digit of area code and exchange must be 2–9
  if (ac[0] === "0" || ac[0] === "1") return false;
  if (ex[0] === "0" || ex[0] === "1") return false;
  // Block known invalid/fake area codes
  if (ac === "555" || ac === "900" || ac === "911" || ac === "999") return false;
  // Block all-same-digit area codes (111, 222, … 999) — not assigned
  if (ac[0] === ac[1] && ac[1] === ac[2]) return false;
  // Block exchange 555 (TV/movie fake numbers)
  if (ex === "555") return false;
  return true;
}

function phoneErrorMsg(val) {
  const d = val.replace(/\D/g, "");
  if (d.length !== 10) return "Please enter a 10-digit US number — area code + 7 digits.";
  const ac = d.slice(0, 3);
  const ex = d.slice(3, 6);
  if (ac[0] === "0" || ac[0] === "1") return `Area code can't start with ${ac[0]}. Please use a real US area code.`;
  if (ac === "555" || ac === "900" || ac === "911" || ac[0] === ac[1] && ac[1] === ac[2]) return "That doesn't look like a real US area code. Please try again.";
  if (ex[0] === "0" || ex[0] === "1" || ex === "555") return "That number prefix isn't valid. Please enter a real US phone number.";
  return "Please enter a valid 10-digit US phone number.";
}

function buildKBWrap(isFirst) {
  const wrap = document.createElement("div");
  wrap.className = "kb-input-wrap";

  // ── Hint (first open only)
  if (isFirst) {
    const hint = document.createElement("div");
    hint.className = "kb-input-hint";
    hint.textContent = "Ask anything about your case, our fees, the process — we'll answer it straight. 💬";
    wrap.appendChild(hint);
  }

  // ── Text input row
  const inputRow = document.createElement("div");
  inputRow.className = "kb-input-row";
  const inp = document.createElement("input");
  inp.id = "kbInput";
  inp.type = "text";
  inp.placeholder = isFirst ? "What's your question?" : "Ask another question…";
  inp.autocomplete = "off";
  inp.addEventListener("keydown", e => { if (e.key === "Enter") sendQuestion(); });
  const sendBtn = document.createElement("button");
  sendBtn.className = "submit-btn";
  sendBtn.style.cssText = "padding:0 18px;white-space:nowrap;";
  sendBtn.textContent = "Send →";
  sendBtn.onclick = sendQuestion;
  inputRow.appendChild(inp);
  inputRow.appendChild(sendBtn);
  wrap.appendChild(inputRow);

  // ── Practice area cards
  const areaLabel = document.createElement("div");
  areaLabel.className = "kb-chips-label";
  areaLabel.style.marginTop = "14px";
  areaLabel.textContent = "Or jump to a practice area:";
  wrap.appendChild(areaLabel);

  const grid = document.createElement("div");
  grid.className = "opts-grid";
  grid.style.marginBottom = "10px";
  KB_PRACTICES.forEach(p => {
    const card = document.createElement("div");
    card.className = "practice-card";
    card.innerHTML = `<div class="pc-icon">${p.icon}</div><div class="pc-title">${p.title}</div><div class="pc-desc">${p.desc}</div>`;
    card.onclick = () => {
      _savedOptsHTML = null;
      clearOpts();
      addMsg(p.title, "user");
      jumpToArea(p.value);
    };
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  // ── Injury type chips
  const injLabel = document.createElement("div");
  injLabel.className = "kb-chips-label";
  injLabel.textContent = "Quick injury type questions:";
  wrap.appendChild(injLabel);

  const chipsRow = document.createElement("div");
  chipsRow.className = "kb-chips-row";
  KB_INJURY_CHIPS.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "kb-chip";
    btn.textContent = c.label;
    btn.onclick = () => sendKBChip(c.q, c.label);
    chipsRow.appendChild(btn);
  });
  wrap.appendChild(chipsRow);

  // ── Back link
  const back = document.createElement("button");
  back.className = "undo-link";
  back.textContent = "← Back to my case";
  back.onclick = closeQuestionInput;
  wrap.appendChild(back);

  return wrap;
}

function openQuestionInput() {
  _savedOptsHTML = $opts.innerHTML;
  clearOpts();
  $opts.appendChild(buildKBWrap(true));
  scrollDown();
}

function closeQuestionInput() {
  if (_savedOptsHTML !== null) {
    $opts.innerHTML = _savedOptsHTML;
    _savedOptsHTML = null;
  } else {
    clearOpts();
  }
  scrollDown();
}

async function sendQuestion() {
  const input = document.getElementById("kbInput");
  if (!input) return;
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  await _dispatchKBQuestion(text);
}

async function sendKBChip(q, label) {
  await _dispatchKBQuestion(q, label);
}

async function _dispatchKBQuestion(q, displayLabel) {
  clearOpts();
  addMsg(displayLabel || q, "user");

  const answer = matchKB(q);
  showTyping();
  await new Promise(r => setTimeout(r, 900));
  removeTyping();
  addMsg(answer, "bot");

  // Re-show input + chips so they can ask again immediately
  $opts.appendChild(buildKBWrap(false));
  scrollDown();
}

function matchKB(text) {
  const lower = text.toLowerCase();
  const area = S.area;

  const sources = [
    ...(area && KNOWLEDGE_BASE[area] ? KNOWLEDGE_BASE[area] : []),
    ...KNOWLEDGE_BASE.general,
  ];

  let best = null, bestScore = 0;
  sources.forEach(entry => {
    const score = entry.keywords.filter(k => lower.includes(k)).length;
    if (score > bestScore) { bestScore = score; best = entry; }
  });

  if (!best || bestScore === 0) {
    return `That's a great question. For the most accurate answer, call us at <strong>${CFG.phone}</strong> — no cost, no obligation, just a real conversation.`;
  }
  return best.answer;
}

async function jumpToArea(value) {
  // Reset state with area pre-selected, skip the area selection screen
  S = { step:"start", area: value, data:{}, qualified:null };
  _lastQ = null;
  _savedOptsHTML = null;
  $msgs.innerHTML = FLOYD_INTRO_HTML;
  clearOpts();
  setProgress(8);

  const areaName = KB_PRACTICES.find(p => p.value === value)?.title || value;
  await botDelay(`Let's look at your <strong>${areaName}</strong> case. Takes 2 minutes — 100% free and confidential. 🏆`, 1000);

  // Name
  await botDelay("What's your <strong>full name</strong>?", 800);
  const name = await collectInput("Your full name…");
  S.data.leadName = name.trim();
  const firstName = name.trim().split(" ")[0];
  await botDelay(`Nice to meet you, ${firstName}! Let me ask a few quick questions. 👇`, 800);
  setProgress(15);

  if      (value === "auto")   await autoFlow_start();
  else if (value === "wc")     await wcFlow_start();
  else if (value === "gpi")    await gpiFlow_start();
  else if (value === "nh")     await nhFlow_start();
  else if (value === "medmal") await medmalFlow_start();
  else if (value === "ssdi")   await ssdiFlow_start();
}

/* ── Escape lead object for inline onclick ── */
function escLead(lead) {
  return "JSON.parse(decodeURIComponent('" + encodeURIComponent(JSON.stringify(lead)) + "'))";
}

/* ── File handling ── */
function handleFiles(files, key) {
  if (!uploads[key]) uploads[key] = [];
  Array.from(files).forEach(f => {
    const reader = new FileReader();
    reader.onload = e => {
      uploads[key].push({ name: f.name, type: f.type, size: f.size, dataUrl: e.target.result });
      renderFileList(key);
    };
    if (f.size < 5 * 1024 * 1024) {
      reader.readAsDataURL(f);
    } else {
      uploads[key].push({ name: f.name, type: f.type, size: f.size, dataUrl: null });
      renderFileList(key);
    }
  });
}

function handleDrop(e, key) {
  e.preventDefault();
  document.getElementById("uz-" + key)?.classList.remove("over");
  handleFiles(e.dataTransfer.files, key);
}

function renderFileList(key) {
  const el = document.getElementById("fl-" + key);
  if (!el) return;
  const files = uploads[key] || [];
  el.innerHTML = files.map((f, i) => `
    <div class="file-chip">
      ${f.type?.startsWith("image/") ? "🖼️" : "📄"} ${f.name}
      <span class="rm" onclick="removeFile('${key}',${i})">✕</span>
    </div>`).join("");
}

function removeFile(key, idx) {
  if (uploads[key]) { uploads[key].splice(idx, 1); renderFileList(key); }
}

/* ── Signature pad ── */
let sigDrawing = false, sigCtx = null, sigCanvas = null, sigHasMark = false;

function initSigPad() {
  sigCanvas = document.getElementById("sigPad");
  if (!sigCanvas) return;
  // Match display size to pixel size
  sigCanvas.width  = sigCanvas.offsetWidth  * window.devicePixelRatio;
  sigCanvas.height = sigCanvas.offsetHeight * window.devicePixelRatio;
  sigCtx = sigCanvas.getContext("2d");
  sigCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
  sigCtx.strokeStyle = "#1a2535";
  sigCtx.lineWidth   = 2.2;
  sigCtx.lineCap     = "round";
  sigCtx.lineJoin    = "round";
  sigHasMark = false;

  const pos = (e) => {
    const r = sigCanvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: src.clientX - r.left, y: src.clientY - r.top };
  };

  sigCanvas.addEventListener("mousedown",  e => { sigDrawing=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); });
  sigCanvas.addEventListener("mousemove",  e => { if(!sigDrawing) return; const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); markSigned(); });
  sigCanvas.addEventListener("mouseup",    () => sigDrawing=false);
  sigCanvas.addEventListener("mouseleave", () => sigDrawing=false);
  sigCanvas.addEventListener("touchstart", e => { e.preventDefault(); sigDrawing=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); }, {passive:false});
  sigCanvas.addEventListener("touchmove",  e => { e.preventDefault(); if(!sigDrawing) return; const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); markSigned(); }, {passive:false});
  sigCanvas.addEventListener("touchend",   () => sigDrawing=false);
}

function markSigned() {
  if (sigHasMark) return;
  sigHasMark = true;
  document.getElementById("sigGhost")?.style.setProperty("display","none");
  document.getElementById("sigBox")?.classList.add("signed");
  checkRetainerReady();
}

function checkRetainerReady() {
  const street = document.getElementById("retainerStreet")?.value.trim();
  const city   = document.getElementById("retainerCity")?.value.trim();
  const state  = document.getElementById("retainerState")?.value.trim();
  const zip    = document.getElementById("retainerZip")?.value.trim();
  const addrOk = !!(street && city && state && zip);
  const btn = document.getElementById("signBtn");
  if (btn) btn.disabled = !(sigHasMark && addrOk);
}

function clearSig() {
  if (!sigCtx || !sigCanvas) return;
  sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
  sigHasMark = false;
  document.getElementById("sigGhost")?.style.removeProperty("display");
  document.getElementById("sigBox")?.classList.remove("signed");
  checkRetainerReady();
}

/* ── Pending retainer data (stored between sign step and upload step) ── */
let pendingRetainerData = null;

/* ── Submit retainer — saves sig data, advances to upload step ── */
function submitRetainer(lead) {
  const btn = document.getElementById("signBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }

  const sigDataUrl = sigCanvas ? sigCanvas.toDataURL("image/png") : null;

  const street = document.getElementById("retainerStreet")?.value.trim() || "";
  const city   = document.getElementById("retainerCity")?.value.trim()   || "";
  const state  = document.getElementById("retainerState")?.value.trim()  || "";
  const zip    = document.getElementById("retainerZip")?.value.trim()    || "";
  const mailingAddress = [street, city, state, zip].filter(Boolean).join(", ");

  pendingRetainerData = {
    mailingAddress,
    retainerSigned:   true,
    signedAt:         new Date().toISOString(),
    signatureDataUrl: sigDataUrl,
  };

  // Show post-sign upload screen
  const sheet = document.getElementById("modalSheet");
  sheet.innerHTML = `
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-size:40px;margin-bottom:10px;">✅</div>

      <button class="btn-primary" onclick="completeIntake(${escLead(lead)})">Done →</button>
    </div>`;

/* ── Complete intake — fires webhook with all data, shows final screen ── */

  const sheet = document.getElementById("modalSheet");
  sheet.innerHTML = `<div style="text-align:center;padding:40px 20px;font-size:15px;color:var(--text-muted);">Submitting… ⏳</div>`;

  const payload = {
    ...lead,
    ...(pendingRetainerData || {}),
    uploadedDocuments: uploads,
  };

  await fireWebhook(payload);

  const fileCount = Object.values(uploads).flat().length;
  const firstName = (lead.name || "").split(" ")[0];
  const callDetail = lead.callTime === "asap"
    ? "Within 15 minutes"
    : "During your preferred time window";
  const emailRow = lead.email ? `
        <div class="comm-row">
          <div class="comm-icon">📧</div>
          <div class="comm-body">
            <div class="comm-title">Email receipt + signed agreement</div>
            <div class="comm-detail">${lead.email}</div>

  sheet.innerHTML = `
    <div class="final-signed">
      <div class="big-icon">🎉</div>
      <h3>You're All Set, ${firstName}!</h3>
      <p>Your legal agreement has been signed and submitted. Here's what's happening right now:</p>

      <div style="background:var(--surface-2);border-radius:14px;padding:16px 18px;text-align:left;margin-bottom:20px;">
        <div class="checklist-row"><span class="ck">✅</span> Case qualification completed</div>
        <div class="checklist-row"><span class="ck">✅</span> Retainer signed — ${new Date().toLocaleDateString()}</div>
        <div class="checklist-row"><span class="ck">${fileCount > 0 ? "✅" : "⏭️"}</span> ${fileCount > 0 ? `${fileCount} document${fileCount !== 1 ? "s" : ""} uploaded` : "Documents — you can send these later"}</div>
      </div>

      <div class="next-comms">
        <p class="next-comms-title">What happens next</p>
        <div class="comm-row">
          <div class="comm-icon">💬</div>
          <div class="comm-body">
            <div class="comm-title">Text confirmation</div>
            <div class="comm-detail">${lead.phone}</div>
          </div>
          <div class="comm-status sending" id="commTextStatus">Sending</div>
        </div>${emailRow}
        <div class="comm-row">
          <div class="comm-icon">📞</div>
          <div class="comm-body">
            <div class="comm-title">Call from your case manager</div>
            <div class="comm-detail">${callDetail}</div>
          </div>
          <div class="comm-status scheduled">Scheduled</div>
        </div>
      </div>

      <div class="modal-actions" style="flex-direction:column;gap:10px;">
        <button class="btn-primary" onclick="closeModal()">Close</button>
        <button class="btn-ghost" onclick="closeModal();restartChat()">← Evaluate another case</button>

  // Mockup: simulate the SMS/email delivery so the user sees the handoff happen.
  setTimeout(() => {
    const t = document.getElementById("commTextStatus");

    const e = document.getElementById("commEmailStatus");

  }, 1700);
}

    leadName: { label: "Your Name" },

    medmalType: { label: "Type" },

    ssdiCanWork: { label: "Can't Work" },

    ssdiApplied: { label: "Application Status" },
    ssdiMarried: { label: "Marital Status" },
    ssdiIncome: { label: "Income" },
    ssdiConditions: { label: "Conditions" }
  };
  const AREA_LABELS = { auto:"🚗 Auto Accident", wc:"🏗️ Workers' Comp", gpi:"⚕️ Personal Injury", nh:"🏥 Nursing Home", medmal:"🩺 Medical Malpractice", ssdi:"♿ SSDI / Disability" };
  function fmt(v) {
    if (Array.isArray(v)) return v.length ? v.join(", ") : "—";
    if (v == null) return "—";
    if (typeof v === "string") {
      const t = v.trim();
      if (/^yes$/i.test(t)) return "Yes";
      if (/^no$/i.test(t)) return "No";
      return t.length ? t : "—";
    }
    return String(v);
  }
  function collectRows() {
    if (typeof S === "undefined") return [];
    const r = [];
    if (S.area) r.push({ key:"_area", label:"Case Type", value: AREA_LABELS[S.area] || S.area });
    Object.keys(S.data || {}).forEach(k => {
      const v = S.data[k];
      if (v == null || v === "") return;
      const def = PANEL_FIELDS[k];
      if (!def) return;
      r.push({ key:k, label: def.label, value: fmt(v) });
    });
    return r;
  }
  let _last = "";
  window.renderAnswers = function() {
    const list = collectRows();
    const sig = JSON.stringify(list);
    if (sig === _last) return;
    _last = sig;
    const html = list.length === 0
      ? '<div class="ans-empty">Start the chat — your answers will appear here as you go.</div>'

    document.querySelectorAll('[data-answers-count]').forEach(el => el.textContent = list.length);
    if (typeof window.onAnswersRendered === "function") window.onAnswersRendered(list);
  };
  window.onEditRow = function(key) {
    alert("To change this answer, tap ↺ at the top right to reset and re-answer.");
  };
  setInterval(renderAnswers, 350);
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", renderAnswers);
  } else {
    renderAnswers();
  }
})();
